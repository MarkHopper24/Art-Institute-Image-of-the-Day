<!-- TRMNL OG - Half horizontal (top or bottom half of a stacked mashup). -->
<div class="layout layout--top">
  <div class="grid grid--cols-2 gap--medium">
    <div class="col col--start gap--small">
      <div class="value value--xsmall"><b>{{ Title }}</b></div>
      <div class="description clamp--3">{{ Artist }}</div>
      <div class="label clamp--1"><b>Date:</b> {{ DateDisplay }}</div>
    </div>
    <div class="row row-center" style="display: flex; justify-content: center; align-items: center;">
      <img class="image image-dither" style="max-width: 100%; max-height: 170px; height: auto;"
        src="https://raw.githubusercontent.com/MarkHopper24/Art-Institute-Image-of-the-Day/refs/heads/main/artwork.jpg" />
    </div>
  </div>
</div>
<div class="title_bar">
  <span class="title">Art Institute of Chicago</span>
  <span class="instance">Image of the Day</span>
</div>
